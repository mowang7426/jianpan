name: Build RainbowKeyboard Native Packages

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'fix/**' ]

permissions:
  contents: read

jobs:
  emoji-protection:
    name: Emoji preservation regression helpers
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run production Unicode and bitmap helper tests
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation Tests/EmojiProtectionTests.m -I . -o /tmp/emoji-protection-tests
          /tmp/emoji-protection-tests
          xcrun clang -std=c11 -Wall -Wextra -Werror Tests/EmojiBitmapTests.c -I . -o /tmp/emoji-bitmap-tests
          /tmp/emoji-bitmap-tests

  safe-preferences:
    name: Safe preferences startup and isolation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe source selection and theme behavior
        run: python3 Tests/run-safe-checks.py
      - name: Run production relay startup across real processes
        run: python3 Tests/run-relay-host.py

  rootless:
    name: Native Rootless deb
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid xz
      - name: Install Theos and SDK
        run: |
          set -e
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build native Rootless
        run: |
          set -e
          rm -rf packages build
          ARCHS="arm64 arm64e" THEOS_PACKAGE_SCHEME=rootless make clean package FINALPACKAGE=1
          f=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$f"
          mkdir -p build
          cp "$f" build/RainbowKeyboard-rootless.deb
      - name: Verify native Rootless artifact
        run: |
          set -e
          d=build/RainbowKeyboard-rootless.deb
          test -s "$d"
          python3 Tests/verify-package.py "$d" rootless
          ls -lh "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-native-rootless
          path: build/RainbowKeyboard-rootless.deb

  roothide:
    name: Native Roothide deb
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid xz
      - name: Install Roothide Theos and SDK
        run: |
          set -e
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build native Roothide
        run: |
          set -e
          rm -rf packages build
          rm -rf .theos packages build
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          ARCHS=arm64e THEOS_PACKAGE_ARCH=iphoneos-arm64e THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1
          f=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$f"
          mkdir -p build
          cp "$f" build/RainbowKeyboard-roothide.deb
      - name: Verify native Roothide artifact
        run: |
          set -e
          d=build/RainbowKeyboard-roothide.deb
          test -s "$d"
          python3 Tests/verify-package.py "$d" roothide
          ls -lh "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-native-roothide
          path: build/RainbowKeyboard-roothide.deb
